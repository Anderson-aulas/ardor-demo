<style>

:root {
  --fundo: #0d0a10;        /* fundo da página */
  --cartao: #17111c;       /* cartão de login */
  --borda: #2a2030;
  --campo: #0f0b13;        /* fundo do campo de senha */
  --campo-borda: #3a2c40;
  --texto: #f6eef2;
  --texto-suave: #b8a8b1;
  --texto-label: #d9cbd2;
  --texto-rodape: #9a8a93;
  --destaque: #ff4f88;     /* botão e foco */
  --destaque-texto: #1a0710;
  --erro: #ff8a8a;
}
* { box-sizing: border-box; }
.hidden { display: none !important; }

.staticrypt-html, .staticrypt-body { min-height: 100%; height: 100%; margin: 0; background: var(--fundo); }
.staticrypt-content {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  background: var(--fundo); color: var(--texto);
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}

/* ===== Cartão ===== */
.staticrypt-page { width: 100%; max-width: 420px; }
.staticrypt-form {
  background: var(--cartao); border: 1px solid var(--borda); border-radius: 24px;
  padding: 40px 24px 28px; display: flex; flex-direction: column; gap: 24px;
}
@media (min-width: 600px) { .staticrypt-form { padding: 44px 40px 32px; gap: 28px; } }

.staticrypt-instructions { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.ardor-logo { width: 64px; height: 64px; }
.staticrypt-title { margin: 0; font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
.ardor-tag { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; background: #2a1b26; color: #ffb3c9; font-family: "Manrope", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0; vertical-align: middle; }
.ardor-sub { margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: var(--texto-suave); }

/* ===== Formulário ===== */
#staticrypt-form { display: flex; flex-direction: column; gap: 16px; margin: 0; }
.ardor-label { font-size: 13px; font-weight: 600; color: var(--texto-label); margin-bottom: -8px; }
.staticrypt-password-container { position: relative; }
#staticrypt-password {
  width: 100%; height: 52px; padding: 0 52px 0 16px;
  background: var(--campo); border: 1px solid var(--campo-borda); border-radius: 14px;
  color: var(--texto); font-family: inherit; font-size: 16px; /* 16px evita zoom no iPhone */
}
#staticrypt-password::placeholder { color: #7d6d76; }
#staticrypt-password:focus { outline: none; border-color: var(--destaque); box-shadow: 0 0 0 3px rgba(255, 79, 136, 0.28); }

/* botão de mostrar/ocultar senha (o ícone vem do StatiCrypt em preto; o filtro clareia) */
.staticrypt-toggle-password-visibility {
  position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; padding: 12px;
  cursor: pointer; border-radius: 10px; filter: invert(78%) sepia(8%) saturate(300%) hue-rotate(280deg);
}
.staticrypt-toggle-password-visibility:hover { background: rgba(255, 255, 255, 0.04); }

.ardor-erro { margin: -6px 0 0; font-size: 14px; color: var(--erro); }

label.staticrypt-remember { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px; color: var(--texto-label); cursor: pointer; }
.staticrypt-remember input[type="checkbox"] { width: 20px; height: 20px; margin: 0; accent-color: var(--destaque); }

.staticrypt-decrypt-button {
  height: 52px; width: 100%; border: 0; border-radius: 14px; cursor: pointer;
  background: var(--destaque); color: var(--destaque-texto);
  font-family: inherit; font-size: 16px; font-weight: 700; -webkit-appearance: none; appearance: none;
}
.staticrypt-decrypt-button:hover { filter: brightness(1.06); }
.staticrypt-decrypt-button:focus-visible, .staticrypt-toggle-password-visibility:focus-visible { outline: 2px solid #ffd5c8; outline-offset: 2px; }

/* ===== Rodapé ===== */
.ardor-seguro { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--texto-rodape); }
.ardor-idade { margin: 20px 0 0; text-align: center; font-size: 12px; color: var(--texto-rodape); }

.staticrypt-spinner-container { height: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--fundo); }
.staticrypt-spinner { width: 2rem; height: 2rem; border: 0.25em solid #3a2c40; border-right-color: var(--destaque); border-radius: 50%; animation: giro 0.75s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .staticrypt-spinner { animation-duration: 2s; } }
</style>

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    var erro=document.getElementById("ardor-erro");if(erro){erro.textContent=templateError;erro.classList.remove("hidden");document.getElementById("staticrypt-password").select();}else{alert(templateError);}
                }
            });
        </script>
</body>
</html>
